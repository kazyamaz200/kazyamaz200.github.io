name: Validate blog (no deployment)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_MLPA_API_URL: ${{ vars.MLPA_API_URL }}
      PUBLIC_MLPA_ACCEPTING_RESPONSES: ${{ vars.MLPA_ACCEPTING_RESPONSES }}
      PUBLIC_MLPA_CONSENT_VERSION: ${{ vars.MLPA_CONSENT_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:mlpa
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - run: npm test
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
