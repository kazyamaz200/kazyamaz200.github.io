name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PUBLICATION_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    env:
      PUBLIC_MLPA_API_URL: ${{ vars.MLPA_API_URL }}
      PUBLIC_MLPA_ACCEPTING_RESPONSES: ${{ vars.MLPA_ACCEPTING_RESPONSES }}
      PUBLIC_MLPA_CONSENT_VERSION: ${{ vars.MLPA_CONSENT_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: "24"
          cache: false
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
